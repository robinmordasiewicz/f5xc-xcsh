name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:  # Allows manual/programmatic trigger for automated PRs

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run ESLint
        run: npx eslint src/

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check Python formatting
        run: ruff format --check scripts/

      - name: Lint Python code
        run: ruff check scripts/ --output-format=github

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (excluding E2E)
        run: npm test -- --exclude='**/e2e/**'

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  verify-generated:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download enriched API specifications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/download-specs.sh

      - name: Regenerate domains
        run: npx tsx scripts/generate-domains.ts

      - name: Regenerate completions
        run: npx tsx scripts/generate-completions.ts

      - name: Validate generated files exist
        run: |
          echo "Validating generated files..."
          test -f src/types/domains_generated.ts || (echo "❌ domains_generated.ts missing" && exit 1)
          test -d completions || (echo "❌ completions/ directory missing" && exit 1)
          test -f completions/xcsh.bash || (echo "❌ xcsh.bash completion missing" && exit 1)
          test -f completions/_xcsh || (echo "❌ _xcsh zsh completion missing" && exit 1)
          test -f completions/xcsh.fish || (echo "❌ xcsh.fish completion missing" && exit 1)
          echo "✅ All generated files present"

      - name: Check for uncommitted domain changes
        run: |
          if ! git diff --quiet src/types/domains_generated.ts; then
            echo "::error::Domain file differs from regenerated output - commit the changes"
            git diff src/types/domains_generated.ts | head -50
            exit 1
          else
            echo "✅ Domains are up to date."
          fi

      - name: Check for uncommitted completion changes
        run: |
          if ! git diff --quiet completions/; then
            echo "::error::Completion files differ from regenerated output - commit the changes"
            git diff completions/ | head -50
            exit 1
          else
            echo "✅ Completions are up to date."
          fi

  check-e2e-credentials:
    name: Check E2E Credentials
    runs-on: ubuntu-latest
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check if F5 XC credentials are available
        id: check
        run: |
          if [ -n "${{ secrets.F5XC_API_TOKEN }}" ]; then
            echo "has-credentials=true" >> $GITHUB_OUTPUT
            echo "✅ F5 XC credentials available - E2E tests will run"
          else
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "⏭️ F5 XC credentials not configured - E2E tests will be skipped"
          fi

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: check-e2e-credentials
    steps:
      - name: Skip E2E tests (no credentials)
        if: needs.check-e2e-credentials.outputs.has-credentials != 'true'
        run: |
          echo "⏭️ Skipping E2E tests - F5 XC credentials not configured"
          echo "This is expected for external contributors and forks"
          echo "✅ Marking as success to allow PR merge"

      - name: Checkout code
        if: needs.check-e2e-credentials.outputs.has-credentials == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: needs.check-e2e-credentials.outputs.has-credentials == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: needs.check-e2e-credentials.outputs.has-credentials == 'true'
        run: npm ci

      - name: Configure F5 XC credentials
        if: needs.check-e2e-credentials.outputs.has-credentials == 'true'
        run: |
          mkdir -p ~/.xcsh
          echo "${{ secrets.F5XC_API_TOKEN }}" > ~/.xcsh/token

      - name: Run E2E tests
        if: needs.check-e2e-credentials.outputs.has-credentials == 'true'
        run: npm test -- tests/e2e/ --run
        timeout-minutes: 10

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, verify-generated]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download enriched API specifications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/download-specs.sh

      - name: Build package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload completion scripts
        uses: actions/upload-artifact@v7
        with:
          name: completions
          path: completions/
          retention-days: 7
