name: Regression & Acceptance Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  regression-check:
    name: Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test -- tests/regression/known-bugs.test.ts --run

      - name: Fail if regression tests fail
        if: failure()
        run: |
          echo "❌ REGRESSION DETECTED: Known bugs have reappeared!"
          echo "Please review tests/regression/known-bugs.test.ts"
          exit 1

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run acceptance tests
        run: npm test -- tests/acceptance/ --run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 30

  comprehensive-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: [regression-check, acceptance-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run all tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: xcsh-coverage

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [regression-check, acceptance-tests, comprehensive-test-suite]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Regression tests: ${{ needs.regression-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Acceptance tests: ${{ needs.acceptance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Full test suite: ${{ needs.comprehensive-test-suite.result }}" >> $GITHUB_STEP_SUMMARY
